# Build on push, deploy on merge.
#
# The workflow never pushes to the default branch — it opens a pull request
# changing one line, the image tag. That keeps `master` protected with no
# bypass (GitHub does not let you add the built-in github-actions bot to a
# ruleset bypass list), and it keeps the ADR-010 property that what is running
# in the cluster is always a reviewed git state.
name: build and publish

on:
  push:
    branches: [master]
    # The deploy PR only touches kustomization.yaml. Without this, merging it
    # would trigger another build, which would open another PR, forever.
    paths-ignore: [ 'kustomization.yaml' ]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # to push the deploy branch
      pull-requests: write    # to open the PR
      packages: write         # to push to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No `latest`, no re-tagging. An immutable tag is what makes reverting a
      # commit a real rollback: if a tag's contents can change, the cluster and
      # git can disagree while appearing identical.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/vaullet-dev/web:${{ steps.meta.outputs.tag }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Open a deploy pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          sed -i "s|newTag: .*|newTag: ${TAG}|" kustomization.yaml
          if git diff --quiet kustomization.yaml; then
            echo "tag unchanged — nothing to deploy"; exit 0
          fi

          BRANCH="deploy/${TAG}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add kustomization.yaml
          git commit -m "deploy: web ${TAG}"
          git push --force origin "$BRANCH"

          # Reuse an open PR for this tag if the job is re-run.
          if gh pr list --head "$BRANCH" --state open --json number --jq 'length' | grep -qv '^0$'; then
            echo "pull request already open"; exit 0
          fi

          gh pr create \
            --base master --head "$BRANCH" \
            --title "deploy: web ${TAG}" \
            --body "$(printf 'Built from %s\n\nImage: `ghcr.io/vaullet-dev/web:%s`\n\nMerging this is the deploy. Argo CD syncs from `master`, then the Rollout goes to 50%% and waits for a Promote in the Argo UI.' "${GITHUB_SHA}" "${TAG}")"
