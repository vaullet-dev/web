# One Service. Argo Rollouts adds a `rollouts-pod-template-hash` to its selector
# at runtime, so it always points at exactly one ReplicaSet: the active one.
#
# Do NOT put that hash label here. The controller owns it, and switching it is
# the whole blue-green cutover.
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports:
    - { name: http, port: 80, targetPort: http }
