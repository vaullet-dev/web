# http -> https. .dev is HSTS-preloaded so browsers never try http, but curl
# and link checkers do. Delete this first if an ACME challenge ever hangs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-https-redirect
spec:
  parentRefs:
    - { name: vaullet, namespace: traefik, kind: Gateway, sectionName: web }
  hostnames: [ vaullet.dev, www.vaullet.dev ]
  rules:
    - matches: [ { path: { type: PathPrefix, value: / } } ]
      filters:
        - type: RequestRedirect
          requestRedirect: { scheme: https, statusCode: 301 }
