# The apex and www, on the HTTPS listeners only. Nothing here is ever plaintext.
#
# One backend: the `web` Service. The blue-green cutover happens in that
# Service's selector, so this route never changes during a deploy and matches
# git at all times.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
spec:
  parentRefs:
    - { name: vaullet, namespace: traefik, kind: Gateway, sectionName: websecure }
    - { name: vaullet, namespace: traefik, kind: Gateway, sectionName: www }
  hostnames: [ vaullet.dev, www.vaullet.dev ]
  rules:
    - backendRefs:
        - { name: web, port: 80 }
