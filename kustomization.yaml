apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: web
resources:
  - k8s/rollout.yaml
  - k8s/service.yaml
  - k8s/httproute.yaml
  - k8s/redirect.yaml

# CI rewrites newTag on every push to main. This one line IS the deployment:
# Argo CD reconciles the cluster to whatever tag is committed here.
images:
  - name: ghcr.io/vaullet-dev/web
    newTag: sha-f555287
