server {
  listen 8080;

  # Belt and braces with the <meta charset> in the document: without this
  # nginx serves text/html with no charset and the browser guesses Latin-1,
  # which turns every em-dash, euro sign and accented letter into mojibake.
  charset utf-8;
  root /usr/share/nginx/html;
  index index.html;

  # The site is one page plus its icons; anything else is a typo.
  location / { try_files $uri /index.html; }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # The HTML carries the build, so it must never be cached by a proxy;
  # the icons can be.
  location = /index.html { add_header Cache-Control "no-cache" always; }
  location = /favicon.svg { access_log off; expires 7d; }
  location = /apple-touch-icon.png { access_log off; expires 7d; }
}
